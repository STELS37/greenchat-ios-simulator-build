name: build-greenchat-ios-nav-parity-1000050
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_TAG: ios-simulator-1.0.0-build-1000050-nav-parity-liquid-glass
      RELEASE_ASSET: GreenChat-iOS-Simulator-1000050-Nav-Parity-Liquid-Glass.zip
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Select stable Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          xcode_app="$(python3 - <<'PY'
          import pathlib, re
          rows=[]
          for path in pathlib.Path('/Applications').glob('Xcode_26*.app'):
              n=path.name.lower()
              if path.is_symlink() or 'beta' in n or '_rc' in n or '-rc' in n: continue
              m=re.fullmatch(r'Xcode_(\d+(?:\.\d+)*)\.app', path.name)
              if m: rows.append((tuple(map(int,m.group(1).split('.'))),str(path)))
          if not rows: raise SystemExit('Xcode 26 not installed')
          print(max(rows)[1])
          PY
          )"
          export DEVELOPER_DIR="$xcode_app/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          test "$(xcodebuild -version | awk 'NR==1{print $2}' | cut -d. -f1)" -ge 26
      - name: Install Capacitor dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd source/mobile
          npm ci --ignore-scripts
          test -d node_modules/@capacitor/core
          test -d node_modules/@aparajita/capacitor-secure-storage
      - name: Verify exact native navigation contract
        shell: bash
        run: |
          set -euo pipefail
          cd source/mobile
          delegate=ios/App/App/AppDelegate.swift
          css=ios/App/App/public/gc-ios-liquid-glass.css
          grep -F '// GC_IOS_NATIVE_LIQUID_GLASS_TAB_BAR' "$delegate"
          grep -F 'let tabBar = UITabBar(frame: .zero)' "$delegate"
          grep -F "shell.classList.contains('gc-superapp-detail')" "$delegate"
          grep -F '.gc-overlay, .gc-palette-overlay, .gc-msgmenu-layer, .gc-sheet-layer, .gc-viewer' "$delegate"
          grep -F 'UIAccessibility.isReduceMotionEnabled' "$delegate"
          grep -F '.beginFromCurrentState' "$delegate"
          grep -F "let lastSignature = ''" "$delegate"
          grep -F 'tabBar.isTranslucent = true' "$delegate"
          ! grep -Eq 'GC_IOS_CUSTOM_GLASS_TAB_BAR_ONLY|GC_IOS26_LIQUID_GLASS_TAB_BAR|configureWithTransparentBackground|backgroundImage = UIImage|shadowImage = UIImage|standardAppearance =|scrollEdgeAppearance =' "$delegate"
          grep -F 'display: none !important' "$css"
          grep -F 'data-gc-native-tabbar="ios-native"' "$css"
          grep -F '.gc-feed-header' "$css"
          grep -Rqs 'https://greenchat.globalsystem.cc' ios/App/App/public
          ! grep -RqsE 'https://localhost/v1/auth|capacitor://localhost/v1/auth' ios/App/App/public
          grep -F 'path: "../../../node_modules/' ios/App/CapApp-SPM/Package.swift
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' ios/App/App/Info.plist 2>/dev/null || true)" = '' || true
      - name: Compile Xcode 26 iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          cd source/mobile/ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            PRODUCT_BUNDLE_IDENTIFIER=app.greenchat \
            build | tee "$RUNNER_TEMP/xcodebuild-simulator.log"
          app="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app" -a -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = app.greenchat
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = 1000050
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          test -x "$app/$executable"
          lipo -verify_arch arm64 "$app/$executable"
          lipo -info "$app/$executable" | tee "$RUNNER_TEMP/architectures.txt"
          cp -R "$app" "$RUNNER_TEMP/GreenChat.app"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry GreenChat-iOS-Simulator.zip GreenChat.app
          unzip -t GreenChat-iOS-Simulator.zip | tee simulator-zip-verify.txt
          shasum -a 256 GreenChat-iOS-Simulator.zip > GreenChat-iOS-Simulator.zip.sha256
      - name: Launch on iOS 26 Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list -j > "$RUNNER_TEMP/simctl-inventory.json"
          python3 - "$RUNNER_TEMP/simctl-inventory.json" "$RUNNER_TEMP/sim-target.env" <<'PYCODE'
          import json, pathlib, shlex, sys
          inv=json.loads(pathlib.Path(sys.argv[1]).read_text())
          runtimes=[r for r in inv.get('runtimes',[]) if r.get('isAvailable') and '.iOS-' in r.get('identifier','') and int(r.get('version','0').split('.')[0]) >= 26]
          if not runtimes: raise SystemExit('no iOS 26+ runtime')
          runtimes.sort(key=lambda r: tuple(map(int,r['version'].split('.'))), reverse=True)
          devices=[d for d in inv.get('devicetypes',[]) if d.get('name','').startswith('iPhone')]
          preferred=['iPhone 17 Pro','iPhone 16 Pro','iPhone 15 Pro']
          device=next((d for n in preferred for d in devices if d.get('name')==n),devices[0])
          pathlib.Path(sys.argv[2]).write_text('\n'.join([
            f"export GC_SIM_RUNTIME={shlex.quote(runtimes[0]['identifier'])}",
            f"export GC_SIM_RUNTIME_NAME={shlex.quote(runtimes[0]['name'])}",
            f"export GC_SIM_DEVICE_TYPE={shlex.quote(device['identifier'])}",
            f"export GC_SIM_DEVICE_NAME={shlex.quote(device['name'])}",
          ])+'\n')
          PYCODE
          source "$RUNNER_TEMP/sim-target.env"
          udid="$(xcrun simctl create GreenChat-Nav-Parity "$GC_SIM_DEVICE_TYPE" "$GC_SIM_RUNTIME")"
          trap 'xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true; xcrun simctl delete "$udid" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$RUNNER_TEMP/GreenChat.app"
          xcrun simctl launch --terminate-running-process "$udid" app.greenchat | tee "$RUNNER_TEMP/simulator-launch.txt"
          sleep 5
          xcrun simctl get_app_container "$udid" app.greenchat app | tee "$RUNNER_TEMP/simulator-app-container.txt"
          printf 'device=%s\nruntime=%s\n' "$GC_SIM_DEVICE_NAME" "$GC_SIM_RUNTIME_NAME" | tee "$RUNNER_TEMP/simulator-target.txt"
      - name: Publish verified ZIP
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/GreenChat-iOS-Simulator.zip" "$RUNNER_TEMP/$RELEASE_ASSET"
          checksum="$(shasum -a 256 "$RUNNER_TEMP/$RELEASE_ASSET" | awk '{print $1}')"
          printf '%s  %s\n' "$checksum" "$RELEASE_ASSET" > "$RUNNER_TEMP/$RELEASE_ASSET.sha256"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          GreenChat 1.0.0 build 1000050 — iOS Simulator verification artifact.

          Source GreenChat commit: fed5698b3923113c4006641083dccb5c75ad9dcb.
          Exactly one native UIKit UITabBar is present. It mirrors the canonical APK shell visibility: chats/detail and full-screen/modal surfaces hide the bar; top-level tabs show it. Show/hide uses UIKit animation with Reduce Motion support. iOS 26 renders the system bar with Liquid Glass. GreenChat HTML navigation is always hidden on iOS. Production API: https://greenchat.globalsystem.cc.
          SHA-256: $checksum
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/$RELEASE_ASSET" "$RUNNER_TEMP/$RELEASE_ASSET.sha256" "$RUNNER_TEMP/architectures.txt" "$RUNNER_TEMP/xcode-version.txt" "$RUNNER_TEMP/simulator-target.txt"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes" --prerelease
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title 'TEST — GreenChat iOS 1000050 Nav Parity + Liquid Glass' --notes-file "$notes" \
              "$RUNNER_TEMP/$RELEASE_ASSET" "$RUNNER_TEMP/$RELEASE_ASSET.sha256" "$RUNNER_TEMP/architectures.txt" "$RUNNER_TEMP/xcode-version.txt" "$RUNNER_TEMP/simulator-target.txt"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets | jq .
