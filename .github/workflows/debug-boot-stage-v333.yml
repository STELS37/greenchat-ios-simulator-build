name: debug-greenchat-ios-boot-stage-v333
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Read exact identity
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          source_sha="$(tr -d '\r\n' < SOURCE_SHA.txt)"
          builds="$(grep -Eo 'CURRENT_PROJECT_VERSION = [0-9]+;' ios/App/App.xcodeproj/project.pbxproj | sed -E 's/.*= ([0-9]+);/\1/' | sort -u)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(printf '%s\n' "$builds" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          python3 - "$source_sha" <<'PY'
          import json,pathlib,sys
          p=json.loads(pathlib.Path('ios/App/App/public/.gc-build-profile.json').read_text())
          if p.get('build_id') != sys.argv[1]: raise SystemExit('payload/source mismatch')
          PY
          echo "GC_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "GC_BUILD_NUMBER=$builds" >> "$GITHUB_ENV"
          echo "GC_RELEASE_TAG=ios-debug-boot-stage-${builds}-${source_sha:0:8}" >> "$GITHUB_ENV"
          echo "GC_RELEASE_ASSET=GreenChat-iOS-Debug-Boot-${builds}.zip" >> "$GITHUB_ENV"
      - name: Select stable Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          xcode_app="$(python3 - <<'PY'
          import pathlib,re
          rows=[]
          for p in pathlib.Path('/Applications').glob('Xcode_26*.app'):
            if p.is_symlink() or 'beta' in p.name.lower() or 'rc' in p.name.lower(): continue
            m=re.fullmatch(r'Xcode_(\d+(?:\.\d+)*)\.app',p.name)
            if m: rows.append((tuple(map(int,m.group(1).split('.'))),str(p)))
          if not rows: raise SystemExit('Xcode 26 not installed')
          print(max(rows)[1])
          PY
          )"
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$xcode_app/Contents/Developer"
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
      - name: Install local CocoaPods graph
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          npm ci --ignore-scripts
          rm -rf vendor && mkdir vendor
          tar -C vendor -xzf vendor-archives/keychain-swift.tar.gz
          tar -C vendor -xzf vendor-archives/ion-ios-filesystem.tar.gz
          pod --version
          cd ios/App
          pod install --verbose
          test -d App.xcworkspace && test -f Podfile.lock
          grep -F 'IONFilesystemLib' Podfile.lock
          grep -F 'KeychainSwift' Podfile.lock
      - name: Verify native navigation contract
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          d=ios/App/App/AppDelegate.swift; c=ios/App/App/public/gc-ios-liquid-glass.css
          grep -F '// GC_IOS_NATIVE_LIQUID_GLASS_TAB_BAR' "$d"
          grep -F 'let tabBar = UITabBar(frame: .zero)' "$d"
          grep -F "shell.classList.contains('gc-superapp-detail')" "$d"
          grep -F 'tabBar.isTranslucent = true' "$d"
          ! grep -Eq 'configureWithTransparentBackground|backgroundImage = UIImage|shadowImage = UIImage|standardAppearance =|scrollEdgeAppearance =' "$d"
          grep -F 'display: none !important' "$c"
          grep -F 'data-gc-native-tabbar="ios-native"' "$c"
          grep -F -- '--gc-mobile-nav: var(--gc-ios-native-tabbar-overlay);' "$c"
          grep -Rqs 'https://greenchat.globalsystem.cc' ios/App/App/public
          ! grep -RqsE 'https://localhost/v1/auth|capacitor://localhost/v1/auth' ios/App/App/public
          grep -F '<script src="/gc-preboot.js"></script>' ios/App/App/public/index.html
          test -s ios/App/App/public/gc-preboot.js
          grep -F 'gc-preboot-recovery' ios/App/App/public/gc-preboot.js
          grep -F 'gc:ui-ready' ios/App/App/public/gc-bridge.js
          ! grep -Eq 'data-gc-boot|gc-boot-bar|site-loader\.js' ios/App/App/public/index.html
          test ! -d ios/App/CapApp-SPM
      - name: Compile Xcode 26 Simulator app
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO ARCHS=arm64 \
            build | tee "$RUNNER_TEMP/xcodebuild-simulator.log"
          app="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = app.greenchat
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$GC_BUILD_NUMBER"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          archs="$(lipo -archs "$app/$exe")"
          printf '%s\n' "$archs" | tee "$RUNNER_TEMP/architectures.txt"
          printf '%s\n' "$archs" | tr ' ' '\n' | grep -qx arm64
          cp -R "$app" "$RUNNER_TEMP/GreenChat.app"
          cd "$RUNNER_TEMP" && zip -qry GreenChat-iOS-Simulator.zip GreenChat.app
          unzip -t GreenChat-iOS-Simulator.zip | tee simulator-zip-verify.txt
      - name: Launch on iOS 26 Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list -j > "$RUNNER_TEMP/sim.json"
          python3 - "$RUNNER_TEMP/sim.json" "$RUNNER_TEMP/sim.env" <<'PY'
          import json,pathlib,shlex,sys
          x=json.loads(pathlib.Path(sys.argv[1]).read_text())
          rs=[r for r in x['runtimes'] if r.get('isAvailable') and '.iOS-' in r.get('identifier','') and int(r.get('version','0').split('.')[0])>=26]
          rs.sort(key=lambda r:tuple(map(int,r['version'].split('.'))),reverse=True)
          ds=[d for d in x['devicetypes'] if d.get('name','').startswith('iPhone')]
          pref=['iPhone 17 Pro','iPhone 16 Pro','iPhone 15 Pro']; d=next((d for n in pref for d in ds if d['name']==n),ds[0])
          pathlib.Path(sys.argv[2]).write_text(f"export R={shlex.quote(rs[0]['identifier'])}\nexport RN={shlex.quote(rs[0]['name'])}\nexport D={shlex.quote(d['identifier'])}\nexport DN={shlex.quote(d['name'])}\n")
          PY
          source "$RUNNER_TEMP/sim.env"
          u="$(xcrun simctl create GreenChat-Final "$D" "$R")"
          trap 'xcrun simctl shutdown "$u" >/dev/null 2>&1 || true; xcrun simctl delete "$u" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$u"; xcrun simctl bootstatus "$u" -b
          xcrun simctl install "$u" "$RUNNER_TEMP/GreenChat.app"
          # Best effort: newer runtimes may allow notifications in simctl privacy. If not, the output is
          # retained and the screenshots still prove the obsolete web progress splash is not shipped.
          xcrun simctl privacy "$u" grant notifications app.greenchat > "$RUNNER_TEMP/privacy-notifications.txt" 2>&1 || true
          xcrun simctl launch --terminate-running-process "$u" app.greenchat | tee "$RUNNER_TEMP/simulator-launch.txt"
          sleep 3
          xcrun simctl io "$u" screenshot "$RUNNER_TEMP/simulator-screen-3s.png"
          sleep 3
          xcrun simctl io "$u" screenshot "$RUNNER_TEMP/simulator-screen-6s.png"
          sleep 6
          xcrun simctl io "$u" screenshot "$RUNNER_TEMP/simulator-screen-12s.png"
          test -s "$RUNNER_TEMP/simulator-screen-3s.png"
          test -s "$RUNNER_TEMP/simulator-screen-6s.png"
          test -s "$RUNNER_TEMP/simulator-screen-12s.png"
          xcrun simctl get_app_container "$u" app.greenchat app | tee "$RUNNER_TEMP/simulator-app-container.txt"
          printf 'device=%s\nruntime=%s\n' "$DN" "$RN" | tee "$RUNNER_TEMP/simulator-target.txt"
      - name: Publish verified ZIP
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/GreenChat-iOS-Simulator.zip" "$RUNNER_TEMP/$GC_RELEASE_ASSET"
          sum="$(shasum -a 256 "$RUNNER_TEMP/$GC_RELEASE_ASSET" | awk '{print $1}')"
          printf '%s  %s\n' "$sum" "$GC_RELEASE_ASSET" > "$RUNNER_TEMP/$GC_RELEASE_ASSET.sha256"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          GreenChat iOS Simulator build $GC_BUILD_NUMBER.

          - Exact GreenChat source: $GC_SOURCE_SHA
          - Xcode 26 ARM64 Simulator build and iOS 26+ launch verified.
          - CocoaPods backend; no SwiftPM resolver in the build path.
          - One native UIKit UITabBar / system Liquid Glass on iOS 26.
          - Chat/detail, Wallet, More/Settings hide global navigation.
          - Native index contains no legacy gc-boot progress bar; dependency-free preboot + bounded first paint are present.
          - Early screenshots captured at 3s, 6s and 12s after process launch.
          - Production API: https://greenchat.globalsystem.cc
          - SHA-256: $sum
          EOF
          gh release delete "$GC_RELEASE_TAG" -R "$GITHUB_REPOSITORY" -y >/dev/null 2>&1 || true
          gh release create "$GC_RELEASE_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "DEBUG — GreenChat iOS boot-stage $GC_BUILD_NUMBER" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/$GC_RELEASE_ASSET" "$RUNNER_TEMP/$GC_RELEASE_ASSET.sha256" \
            "$RUNNER_TEMP/architectures.txt" "$RUNNER_TEMP/xcode-version.txt" "$RUNNER_TEMP/simulator-target.txt" \
            "$RUNNER_TEMP/privacy-notifications.txt" "$RUNNER_TEMP/simulator-screen-3s.png" \
            "$RUNNER_TEMP/simulator-screen-6s.png" "$RUNNER_TEMP/simulator-screen-12s.png"
