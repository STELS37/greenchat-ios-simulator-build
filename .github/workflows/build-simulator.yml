name: build-greenchat-ios-simulator
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      RELEASE_TAG: ios-simulator-1.0.0-build-1000048-transparent-tabbar
      RELEASE_ASSET: GreenChat-iOS-Simulator-Transparent-Tab-Bar.zip
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git status --short

      - name: Select stable Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          xcode_app="$(python3 - <<'PY'
          import pathlib, re
          rows=[]
          for path in pathlib.Path('/Applications').glob('Xcode_26*.app'):
              if path.is_symlink() or 'beta' in path.name.lower() or 'rc' in path.name.lower():
                  continue
              m=re.fullmatch(r'Xcode_(\d+(?:\.\d+)*)\.app', path.name)
              if m:
                  rows.append((tuple(map(int,m.group(1).split('.'))),str(path)))
          if not rows:
              raise SystemExit('Xcode 26 not installed')
          print(max(rows)[1])
          PY
          )"
          echo "DEVELOPER_DIR=$xcode_app/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$xcode_app/Contents/Developer"
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          test "$(xcodebuild -version | awk 'NR==1{print $2}' | cut -d. -f1)" -ge 26
          node --version
          npm --version
          gh --version | head -1

      - name: Install native package dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd source/mobile
          npm ci --ignore-scripts

      - name: Compile universal iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          cd source/mobile/ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            PRODUCT_BUNDLE_IDENTIFIER=app.greenchat \
            build | tee "$RUNNER_TEMP/xcodebuild-simulator.log"
          app="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app" -a -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = app.greenchat
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = 1000048
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          test -x "$app/$executable"
          lipo -info "$app/$executable" | tee "$RUNNER_TEMP/architectures.txt"
          lipo -verify_arch arm64 x86_64 "$app/$executable"
          strings "$app/$executable" | grep -F 'gc-liquid-glass-tab-bar'
          strings "$app/$executable" | grep -F 'configureWithTransparentBackground'
          cp -R "$app" "$RUNNER_TEMP/GreenChat.app"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry GreenChat-iOS-Simulator.zip GreenChat.app
          unzip -t GreenChat-iOS-Simulator.zip | tee simulator-zip-verify.txt
          shasum -a 256 GreenChat-iOS-Simulator.zip > GreenChat-iOS-Simulator.zip.sha256

      - name: Launch on iOS 26 Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list -j > "$RUNNER_TEMP/simctl-inventory.json"
          python3 - "$RUNNER_TEMP/simctl-inventory.json" "$RUNNER_TEMP/sim-target.env" <<'PYCODE'
          import json, pathlib, shlex, sys
          inventory = json.loads(pathlib.Path(sys.argv[1]).read_text())
          runtimes = [
              row for row in inventory.get("runtimes", [])
              if row.get("isAvailable") and ".iOS-" in row.get("identifier", "")
              and int(row.get("version", "0").split(".")[0]) >= 26
          ]
          if not runtimes:
              raise SystemExit("no available iOS 26+ Simulator runtime")
          runtimes.sort(key=lambda row: tuple(int(part) for part in row["version"].split(".")), reverse=True)
          devices = [row for row in inventory.get("devicetypes", []) if row.get("name", "").startswith("iPhone")]
          preferred_names = ["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 15 Pro"]
          device = next((row for name in preferred_names for row in devices if row.get("name") == name), devices[0])
          pathlib.Path(sys.argv[2]).write_text("\n".join([
              f"export GC_SIM_RUNTIME={shlex.quote(runtimes[0]['identifier'])}",
              f"export GC_SIM_RUNTIME_NAME={shlex.quote(runtimes[0]['name'])}",
              f"export GC_SIM_DEVICE_TYPE={shlex.quote(device['identifier'])}",
              f"export GC_SIM_DEVICE_NAME={shlex.quote(device['name'])}",
          ]) + "\n")
          PYCODE
          source "$RUNNER_TEMP/sim-target.env"
          udid="$(xcrun simctl create GreenChat-Transparent-Tab-Bar "$GC_SIM_DEVICE_TYPE" "$GC_SIM_RUNTIME")"
          trap 'xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true; xcrun simctl delete "$udid" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$RUNNER_TEMP/GreenChat.app"
          xcrun simctl launch --terminate-running-process "$udid" app.greenchat | tee "$RUNNER_TEMP/simulator-launch.txt"
          sleep 12
          xcrun simctl get_app_container "$udid" app.greenchat app | tee "$RUNNER_TEMP/simulator-app-container.txt"
          printf 'device=%s\nruntime=%s\n' "$GC_SIM_DEVICE_NAME" "$GC_SIM_RUNTIME_NAME" \
            | tee "$RUNNER_TEMP/simulator-target.txt"

      - name: Publish verified ZIP
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/GreenChat-iOS-Simulator.zip" "$RUNNER_TEMP/$RELEASE_ASSET"
          checksum="$(shasum -a 256 "$RUNNER_TEMP/$RELEASE_ASSET" | awk '{print $1}')"
          printf '%s  %s\n' "$checksum" "$RELEASE_ASSET" > "$RUNNER_TEMP/$RELEASE_ASSET.sha256"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          GreenChat 1.0.0 build 1000048.

          - Compiled with Xcode 26+ for iOS Simulator.
          - Universal simulator binary: arm64 + x86_64.
          - The large grey outer UITabBar capsule, material, separator and shadow are removed.
          - Only the navigation items and active selection remain above the continuing app screen.
          - Authentication gating remains enabled: tabs are hidden before login.
          - SHA-256: $checksum
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              "$RUNNER_TEMP/$RELEASE_ASSET" \
              "$RUNNER_TEMP/$RELEASE_ASSET.sha256" \
              "$RUNNER_TEMP/architectures.txt" \
              "$RUNNER_TEMP/xcode-version.txt" \
              "$RUNNER_TEMP/simulator-target.txt"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'GreenChat iOS Simulator — Transparent Tab Bar' \
              --notes-file "$notes" \
              "$RUNNER_TEMP/$RELEASE_ASSET" \
              "$RUNNER_TEMP/$RELEASE_ASSET.sha256" \
              "$RUNNER_TEMP/architectures.txt" \
              "$RUNNER_TEMP/xcode-version.txt" \
              "$RUNNER_TEMP/simulator-target.txt"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets | jq .
